name: Phase 1 reproducibility

on:
  push:
  pull_request:

jobs:
  test-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and Phase 1 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-phase1.txt
      - name: Run tests
        run: pytest -q
      - name: Regenerate Phase 1 artifacts
        env:
          MPLBACKEND: Agg
        run: |
          python examples/bo_intro.py
          python examples/02_lengthscale_sensitivity.py
      - name: Verify artifacts were produced
        run: |
          test -s assets/bo_intro_result.png
          test -s assets/bo_intro_progress.png
          test -s assets/lengthscale_sensitivity.png
          test -s results/phase1/bo_intro_trace.csv
          python -m json.tool results/phase1/bo_intro_summary.json > /dev/null
